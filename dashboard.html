<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECU Control Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Vehicle ECU Remote Control Dashboard</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="dashboard-grid">
        <div class="ecu-panel">
            <h2>Brake Controller <span class="status-indicator"></span></h2>
            <div class="control-group">
                <button class="toggle-btn" onclick="toggleRelay(this, 'brake')">Relay 1 OFF</button>
            </div>
        </div>

        <div class="ecu-panel">
            <h2>Steering System 1 <span class="status-indicator"></span></h2>
            <div class="control-group">
                <button class="toggle-btn" onclick="toggleRelay(this, 'steering1')">Relay 2 OFF</button>
            </div>
        </div>

        <div class="ecu-panel">
            <h2>Steering System 2 <span class="status-indicator"></span></h2>
            <div class="control-group">
                <button class="toggle-btn" onclick="toggleRelay(this, 'steering2')">Relay 3 OFF</button>
            </div>
        </div>

        <div class="ecu-panel">
            <h2>MCM Radio Receiver <span class="status-indicator"></span></h2>
            <div class="control-group">
                <button class="toggle-btn" onclick="toggleRelay(this, 'mcm')">Relay 4 OFF</button>
            </div>
        </div>

        <div class="ecu-panel">
            <h2>TCM Accelerator <span class="status-indicator"></span></h2>
            <div class="control-group">
                <button class="toggle-btn" onclick="toggleRelay(this, 'tcm')">Relay 5 OFF</button>
            </div>
        </div>

        <div class="ecu-panel">
            <h2>LSCM Lighting System <span class="status-indicator"></span></h2>
            <div class="control-group">
                <button class="toggle-btn" onclick="toggleRelay(this, 'lscm')">Relay 6 OFF</button>
            </div>
        </div>

        <div class="ecu-panel">
            <h2>5V Power Supply <span class="status-indicator"></span></h2>
            <div class="control-group">
                <button class="toggle-btn" onclick="toggleRelay(this, 'power')">Relay 7 OFF</button>
            </div>
        </div>

        <div class="ecu-panel">
            <h2>Raspberry Pi CAN Hat <span class="status-indicator"></span></h2>
            <div class="control-group">
                <button class="toggle-btn" onclick="toggleRelay(this, 'canhat')">Relay 8 OFF</button>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in when loading dashboard
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.replace('index.html');
            }
        }

        // Prevent using back button
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function () {
            window.history.pushState(null, null, window.location.href);
        };

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.replace('index.html');
        }

        function toggleRelay(button, system) {
            const isActive = button.classList.toggle('active');
            button.textContent = `Relay ${getRelayNumber(system)} ${isActive ? 'ON' : 'OFF'}`;
            
            // Here you would typically send a request to your Raspberry Pi
            console.log(`Relay ${getRelayNumber(system)} turned ${isActive ? 'ON' : 'OFF'}`);
            
            // Update status indicator
            const panel = button.closest('.ecu-panel');
            const indicator = panel.querySelector('.status-indicator');
            indicator.style.backgroundColor = isActive ? '#4CAF50' : '#ff0000';
        }

        function getRelayNumber(system) {
            const relayMap = {
                'brake': '1',
                'steering1': '2',
                'steering2': '3',
                'mcm': '4',
                'tcm': '5',
                'lscm': '6',
                'power': '7',
                'canhat': '8'
            };
            return relayMap[system];
        }

        // Initialize all status indicators as red (OFF)
        window.onload = function() {
            // Check login status
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.replace('index.html');
                return;
            }

            // Set initial status indicators
            document.querySelectorAll('.status-indicator').forEach(indicator => {
                indicator.style.backgroundColor = '#ff0000';
            });
        }
    </script>
</body>
</html>
