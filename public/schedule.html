<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Dashboard Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container" id="loginSection">
        <div class="login-box">
            <h1>Schedule Access Login</h1>
            <form id="loginForm">
                <div class="input-group">
                    <label for="name">Username:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div id="loginFeedback" class="feedback-message"></div>
            </form>
        </div>
    </div>

    <div class="schedule-section" id="scheduleSection" style="display: none;">
        <div class="header">
            <div class="header-content">
                <h1>Schedule Dashboard Access</h1>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="schedule-container">
            <div class="schedule-box">
                <h2>Set Access Schedule</h2>
                <form id="scheduleForm">
                    <div class="input-group">
                        <label for="startTime">Start Time:</label>
                        <input type="datetime-local" id="startTime" required>
                    </div>
                    <div class="input-group">
                        <label for="endTime">End Time:</label>
                        <input type="datetime-local" id="endTime" required>
                    </div>
                    <button type="submit" class="login-btn">Schedule Access</button>
                    <div id="scheduleFeedback" class="feedback-message"></div>
                </form>
                <div id="currentSchedule" class="schedule-list"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, password }),
                });
                const data = await response.json();
                
                if (data.success) {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('username', name);
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('scheduleSection').style.display = 'block';
                    loadSchedules();
                } else {
                    alert('Invalid login credentials');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Login failed');
            }
        });

        // Load schedules on page load
        window.onload = function() {
            loadSchedules();
        }

        // Add logout function
        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        document.getElementById('scheduleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const username = sessionStorage.getItem('username');

            if (!username) {
                alert('Please log in first');
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('/schedule', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        startTime,
                        endTime
                    })
                });

                const data = await response.json();
                if (data.success) {
                    alert('Schedule created successfully!');
                    loadSchedules();
                    document.getElementById('scheduleForm').reset();
                } else {
                    alert('Failed to create schedule: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error creating schedule');
            }
        });

        async function loadSchedules() {
            try {
                const response = await fetch('/schedules/' + sessionStorage.getItem('username'));
                const schedules = await response.json();
                const scheduleList = document.getElementById('currentSchedule');
                scheduleList.innerHTML = '<h3>Current Schedules</h3>';
                schedules.forEach(schedule => {
                    const div = document.createElement('div');
                    div.className = 'schedule-item';
                    div.innerHTML = `
                        <div>
                            <p>Start: ${new Date(schedule.startTime).toLocaleString()}</p>
                            <p>End: ${new Date(schedule.endTime).toLocaleString()}</p>
                        </div>
                        <button onclick="deleteSchedule('${schedule.id}')" class="delete-btn">Delete</button>
                    `;
                    scheduleList.appendChild(div);
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteSchedule(id) {
            try {
                const response = await fetch('/schedule/' + id, {
                    method: 'DELETE',
                });
                const data = await response.json();
                if (data.success) {
                    loadSchedules();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
