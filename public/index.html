<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Data to C++ Server</title>
</head>
<body>
  <button id="on-button">Turn ON</button>
  <button id="off-button">Turn OFF</button>
  <div id="response"></div>
  
  <script>
    document.getElementById('on-button').addEventListener('click', () => {
      sendStatus('ON');
    });
  
    document.getElementById('off-button').addEventListener('click', () => {
      sendStatus('OFF');
    });
  
    function sendStatus(status) {
      fetch('/send-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: status }),
      })
        .then(response => response.json())
        .then(data => {
          document.getElementById('response').textContent = data.message;
        })
        .catch(error => {
          console.error('Error:', error);
        });
    }
  </script>
  
</body>
</html>
